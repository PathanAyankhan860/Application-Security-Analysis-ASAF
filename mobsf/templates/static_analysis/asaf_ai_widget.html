{% load static %}
<div class="card card-outline card-primary">
  <div class="card-header">
    <h3 class="card-title"><i class="fas fa-robot"></i> Ask ASAF AI</h3>
  </div>
  <div class="card-body">
    <p class="text-muted">
      AI-generated context uses current ASAF scan results only. ASAF findings and
      severities remain the source of truth.
    </p>
    <div class="form-row">
      <div class="form-group col-md-3">
        <label for="asaf-ai-category">Finding category</label>
        <input id="asaf-ai-category" class="form-control" placeholder="code_analysis">
      </div>
      <div class="form-group col-md-2">
        <label for="asaf-ai-index">Finding index</label>
        <input id="asaf-ai-index" class="form-control" placeholder="0">
      </div>
      <div class="form-group col-md-7">
        <label for="asaf-ai-title">Finding title</label>
        <input id="asaf-ai-title" class="form-control" placeholder="Optional exact finding title">
      </div>
    </div>
    <button id="asaf-ai-analyze-btn" type="button" class="btn btn-primary btn-sm">
      <i class="fas fa-search"></i> Analyze with AI
    </button>
    <button id="asaf-ai-summary-btn" type="button" class="btn btn-secondary btn-sm">
      <i class="fas fa-clipboard-list"></i> AI Security Summary
    </button>
    <hr>
    <label for="asaf-ai-question">Ask ASAF AI about this scan</label>
    <div class="input-group">
      <input id="asaf-ai-question" class="form-control"
             placeholder="What should the developer investigate first?">
      <div class="input-group-append">
        <button id="asaf-ai-ask-btn" type="button" class="btn btn-info">Ask</button>
      </div>
    </div>
    <pre id="asaf-ai-result" class="mt-3 p-3 bg-light border rounded"
         style="white-space: pre-wrap; min-height: 120px;">AI output will appear here.</pre>
  </div>
</div>
<script>
window.ASAF_AI = {
  hash: '{{ md5 }}',
  csrf: '{{ csrf_token }}',
  endpoints: {
    analyze: '{% url "ai_web_analyze_finding" %}',
    summary: '{% url "ai_web_scan_summary" %}',
    ask: '{% url "ai_web_ask" %}'
  }
};
</script>
<script src="{% static "others/asaf_ai.js" %}"></script>
